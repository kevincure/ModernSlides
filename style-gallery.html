<style id="app-styles">
:root {
  --ui-bg: #f4f2ed;
  --ui-panel: #fffef9;
  --ui-text: #1d1d1d;
  --ui-muted: #707070;
  --ui-line: #d7d2c8;
  --ui-accent: #222;
  --ui-danger: #a52a2a;
  --ui-success: #137333;
  --ui-font: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --ui-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { font-family: var(--ui-font); background: #000; color: var(--ui-text); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .42; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

/* ---------- One canonical slide frame ---------- */
.slide-frame {
  --base: 3cqw;
  --fit: 1;
  --u: calc(var(--base) * var(--fit));
  --bg: #fffff8;
  --text: #171717;
  --accent: #222;
  --accent-2: #666;
  --line: #d8d8d0;
  --body-font: "Source Serif 4", Georgia, serif;
  --display-font: "Source Serif 4", Georgia, serif;
  --sans-font: Lato, Arial, sans-serif;
  --mono-font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --slide-pad-top: 4cqw;
  --slide-pad-right: 5cqw;
  --slide-pad-bottom: 4.5cqw;
  --slide-pad-left: 5cqw;
  --flow-width: 82%;
  --flow-justify: safe center;
  --body-weight: 400;
  --body-leading: 1.48;
  --title-scale: 2.15;
  --title-leading: 1.08;
  --title-weight: 600;
  --title-align: center;
  --title-transform: none;
  --title-letter-spacing: 0;
  --title-color: var(--text);
  --title-border: max(1px, .035cqw) solid var(--line);
  --title-pad-bottom: .35cqw;
  --title-margin-bottom: .65cqw;
  --big-scale: 1.58;
  --small-scale: .67;
  --tiny-scale: .36;
  --caption-scale: .45;
  --header-scale: .46;
  --aside-scale: .42;
  --quote-scale: 1.4;
  --quote-source-scale: .54;
  --bold-weight: 700;
  --bold-color: inherit;
  --bold-bg: transparent;
  --bold-pad: 0;
  --bold-radius: 0;
  --italic-style: italic;
  --italic-color: inherit;
  --italic-bg: transparent;
  --italic-pad: 0;
  --bolditalic-color: inherit;
  --bolditalic-bg: transparent;
  --bolditalic-pad: 0;
  --col-gap: 1.4cqw;
  --col-pad: 0;
  --col-bg: transparent;
  --col-border: 0 solid transparent;
  --col-radius: 0;
  --table-scale: .61;
  --table-border: max(1px, .035cqw) solid var(--line);
  --table-header-bg: transparent;
  --table-header-color: var(--text);
  --table-row-alt: transparent;
  --logo-top: 1.1cqw;
  --logo-right: 1.2cqw;
  --logo-bottom: auto;
  --logo-left: auto;
  --logo-width: 7cqw;
  --logo-height: 2.5cqw;
  --logo-object-fit: contain;
  --footer-scale: .34;
  --footer-color: var(--accent-2);
  --aside-top: 2.4cqw;
  --aside-right: 2.2cqw;
  --aside-width: 15cqw;
  --aside-bg: transparent;
  --aside-border: 0;
  --aside-pad: 0;
  --progress-height: .15cqw;
  --progress-bg: var(--accent);
  --background-tint: 82%;

  position: absolute;
  width: 1600px;
  height: 900px;
  overflow: hidden;
  container-type: inline-size;
  container-name: modernslide;
  transform-origin: top left;
  background: var(--bg);
  color: var(--text);
  font-family: var(--body-font);
  font-size: var(--u);
  line-height: var(--body-leading);
  isolation: isolate;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

.slide-background,
.slide-background::after {
  position: absolute;
  inset: 0;
  content: "";
}
.slide-background {
  z-index: -3;
  background-color: var(--bg);
  background-image: var(--background-image, none), var(--stage-decoration, none);
  background-position: center;
  background-size: var(--background-size, cover), cover;
  background-repeat: no-repeat;
}
.slide-background::after {
  z-index: 1;
  background: var(--background-overlay, transparent);
}
.slide-frame.background-full .slide-background::after { background: transparent; }

.slide-inner {
  position: absolute;
  inset: 0;
  padding: var(--slide-pad-top) var(--slide-pad-right) var(--slide-pad-bottom) var(--slide-pad-left);
  display: flex;
  min-width: 0;
  min-height: 0;
}
.slide-flow {
  width: var(--flow-width);
  height: 100%;
  min-width: 0;
  min-height: 0;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  justify-content: var(--flow-justify);
  align-items: stretch;
  overflow: visible;
}
.slide-frame.layout-top { --flow-justify: flex-start; }
.slide-frame.layout-center { --flow-width: 72%; --flow-justify: safe center; }
.slide-frame.layout-statement { --flow-width: 72%; --flow-justify: safe center; --title-scale: 2.5; --big-scale: 2.05; }
.slide-frame.layout-data { --flow-width: 92%; --flow-justify: safe center; }
.slide-frame.layout-full { --flow-width: 100%; --slide-pad-top: 0; --slide-pad-right: 0; --slide-pad-bottom: 0; --slide-pad-left: 0; }

.slide-header {
  position: absolute;
  z-index: 4;
  top: 0;
  left: 0;
  width: 100%;
  padding: .28cqw .55cqw;
  font: 600 calc(var(--u) * var(--header-scale)) / 1.25 var(--sans-font);
  color: var(--accent-2);
  letter-spacing: .06em;
  text-transform: uppercase;
  pointer-events: none;
}
.slide-aside {
  position: absolute;
  z-index: 5;
  top: var(--aside-top);
  right: var(--aside-right);
  width: var(--aside-width);
  padding: var(--aside-pad);
  background: var(--aside-bg);
  border: var(--aside-border);
  font: 400 calc(var(--u) * var(--aside-scale)) / 1.35 var(--sans-font);
  color: var(--accent-2);
}
.slide-logo {
  position: absolute;
  z-index: 6;
  top: var(--logo-top);
  right: var(--logo-right);
  bottom: var(--logo-bottom);
  left: var(--logo-left);
  width: var(--logo-width);
  height: var(--logo-height);
  object-fit: var(--logo-object-fit);
}
.slide-footer {
  position: absolute;
  z-index: 5;
  left: var(--slide-pad-left);
  right: var(--slide-pad-right);
  bottom: .8cqw;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1cqw;
  color: var(--footer-color);
  font: 500 calc(var(--u) * var(--footer-scale)) / 1 var(--sans-font);
  pointer-events: none;
}
.slide-number { white-space: nowrap; }
.slide-progress {
  position: absolute;
  z-index: 6;
  left: 0;
  bottom: 0;
  height: var(--progress-height);
  width: var(--progress-percent, 0%);
  background: var(--progress-bg);
}

.slide-title {
  width: 100%;
  margin: 0 0 var(--title-margin-bottom);
  padding: 0 0 var(--title-pad-bottom);
  border-bottom: var(--title-border);
  color: var(--title-color);
  font-family: var(--display-font);
  font-size: calc(var(--u) * var(--title-scale));
  font-weight: var(--title-weight);
  font-style: normal;
  line-height: var(--title-leading);
  letter-spacing: var(--title-letter-spacing);
  text-align: var(--title-align);
  text-transform: var(--title-transform);
  text-wrap: balance;
}
.slide-block {
  position: relative;
  width: 100%;
  min-width: 0;
  flex: 0 0 auto;
}
.block-text {
  font-size: calc(var(--u) * var(--text-size, 1));
  font-weight: var(--body-weight);
  line-height: var(--body-leading);
  margin: calc(var(--u) * .16) 0;
}
.block-text.size-big { --text-size: var(--big-scale); line-height: 1.18; text-align: center; }
.block-text.size-small { --text-size: var(--small-scale); line-height: 1.42; color: var(--accent-2); }
.block-text.size-tiny { --text-size: var(--tiny-scale); line-height: 1.34; color: var(--accent-2); font-family: var(--sans-font); }
.align-left { text-align: left !important; }
.align-center { text-align: center !important; }
.align-right { text-align: right !important; }

.slide-frame strong {
  font-weight: var(--bold-weight);
  color: var(--bold-color);
  background: var(--bold-bg);
  padding: var(--bold-pad);
  border-radius: var(--bold-radius);
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.slide-frame em {
  font-style: var(--italic-style);
  color: var(--italic-color);
  background: var(--italic-bg);
  padding: var(--italic-pad);
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.slide-frame strong em,
.slide-frame em strong {
  color: var(--bolditalic-color);
  background: var(--bolditalic-bg);
  padding: var(--bolditalic-pad);
}
.slide-frame a { color: var(--accent); text-decoration-thickness: .055em; text-underline-offset: .12em; }

.block-list {
  margin: calc(var(--u) * .15) 0;
  padding-left: 1.35em;
  font-size: calc(var(--u) * var(--text-size, 1));
  line-height: 1.42;
}
.block-list li { margin: .18em 0; padding-left: .14em; }
.block-list.size-big { --text-size: var(--big-scale); }
.block-list.size-small { --text-size: var(--small-scale); color: var(--accent-2); }
.block-list.size-tiny { --text-size: var(--tiny-scale); color: var(--accent-2); }

.block-quote {
  margin: calc(var(--u) * .32) 0;
  padding: calc(var(--u) * .38) calc(var(--u) * .52);
  border-left: max(2px, .12cqw) solid var(--accent);
  background: color-mix(in srgb, var(--bg) 88%, var(--accent) 12%);
}
.quote-text {
  font: 400 calc(var(--u) * var(--quote-scale)) / 1.2 var(--display-font);
  font-style: italic;
}
.quote-source {
  margin-top: calc(var(--u) * .24);
  font: 600 calc(var(--u) * var(--quote-source-scale)) / 1.2 var(--sans-font);
  color: var(--accent-2);
  text-align: right;
}

.block-break { height: calc(var(--u) * var(--lines, 1)); }
.block-rule { margin: calc(var(--u) * .4) 0; border: 0; border-top: max(1px, .05cqw) solid var(--line); }
.block-code {
  margin: calc(var(--u) * .22) 0;
  padding: calc(var(--u) * .42);
  overflow: hidden;
  border: max(1px, .04cqw) solid var(--line);
  border-radius: .25cqw;
  background: color-mix(in srgb, var(--bg) 88%, var(--text) 12%);
  color: var(--text);
  font: 400 calc(var(--u) * .62) / 1.38 var(--mono-font);
  white-space: pre-wrap;
  tab-size: 2;
}

.block-image {
  min-height: 0;
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: calc(var(--u) * .15) auto;
  width: var(--image-width, 100%);
  overflow: hidden;
}
.block-image img {
  display: block;
  width: 100%;
  min-height: 0;
  max-height: 100%;
  flex: 1 1 auto;
  object-fit: var(--image-fit, contain);
  object-position: var(--image-focus, center);
}
.image-caption {
  flex: 0 0 auto;
  max-width: 94%;
  margin-top: calc(var(--u) * .18);
  color: var(--accent-2);
  font: 400 calc(var(--u) * var(--caption-scale)) / 1.28 var(--sans-font);
  text-align: center;
}

.block-website {
  min-height: 0;
  flex: 1 1 0;
  display: flex;
  align-items: stretch;
  justify-content: stretch;
  margin: calc(var(--u) * .18) 0;
}
.website-card {
  position: relative;
  width: 100%;
  min-height: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: max(1px, .05cqw) solid color-mix(in srgb, var(--line) 70%, var(--accent) 30%);
  border-radius: .4cqw;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--bg) 74%, var(--accent) 26%), var(--bg));
  color: var(--text);
  text-align: center;
}
.website-card.has-poster {
  background-image: linear-gradient(rgba(0,0,0,.36), rgba(0,0,0,.36)), var(--poster-image);
  background-size: cover;
  background-position: center;
  color: #fff;
}
.website-card-content { max-width: 74%; padding: 2cqw; }
.website-icon { font-size: calc(var(--u) * 2); line-height: 1; }
.website-label { margin-top: .35em; font: 700 calc(var(--u) * .9) / 1.1 var(--sans-font); }
.website-url { margin-top: .7em; font: 400 calc(var(--u) * .42) / 1.35 var(--mono-font); opacity: .82; overflow-wrap: anywhere; }
.website-live-button { display: none !important; }
.website-live-frame { width: 100%; height: 100%; border: 0; background: #fff; }

.block-columns {
  min-height: 0;
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: var(--column-template, repeat(2, minmax(0,1fr)));
  gap: var(--col-gap);
  align-items: var(--column-valign, center);
  margin: calc(var(--u) * .16) 0;
}
.slide-column {
  min-width: 0;
  min-height: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: var(--column-valign, center);
  overflow: hidden;
  padding: var(--col-pad);
  background: var(--col-bg);
  border: var(--col-border);
  border-radius: var(--col-radius);
}
.slide-column .block-image { min-height: 0; }

.block-table {
  width: 100%;
  margin: calc(var(--u) * .18) auto;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: calc(var(--u) * var(--table-scale));
  line-height: 1.28;
}
.block-table th,
.block-table td {
  padding: calc(var(--u) * .25) calc(var(--u) * .3);
  border: var(--table-border);
  vertical-align: top;
  overflow-wrap: anywhere;
}
.block-table th {
  background: var(--table-header-bg);
  color: var(--table-header-color);
  font-family: var(--sans-font);
  font-weight: 700;
}
.block-table tbody tr:nth-child(even) td { background: var(--table-row-alt); }

.future-step, .past-step { visibility: hidden !important; }
.slide-frame[data-overflow="true"]::after {
  content: "";
  position: absolute;
  inset: .35cqw;
  border: .08cqw solid rgba(175, 30, 30, .72);
  pointer-events: none;
  display: var(--show-overflow, none);
}

/* ---------- Presentation ---------- */
#presentation-view { position: fixed; inset: 0; display: grid; place-items: center; background: #000; overflow: hidden; }
.stage-slot { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
#presentation-slot .slide-frame { box-shadow: 0 0 4rem rgba(0,0,0,.5); }
#mobile-nav {
  position: fixed; z-index: 40; left: 50%; bottom: 1rem; transform: translateX(-50%);
  display: none; gap: .55rem; align-items: center; padding: .45rem .6rem;
  border-radius: 999px; background: rgba(0,0,0,.58); backdrop-filter: blur(8px);
}
#mobile-nav button { min-width: 2.5rem; min-height: 2.5rem; border: 0; border-radius: 999px; background: rgba(255,255,255,.18); color: #fff; }
#mobile-status { color: #fff; font: 600 .8rem/1 var(--ui-mono); min-width: 4rem; text-align: center; }
@media (pointer: coarse), (max-width: 850px) { body:not(.edit-mode) #mobile-nav { display: flex; } }

/* ---------- Editor ---------- */
#editor-view {
  position: fixed;
  inset: 0;
  display: none;
  grid-template-columns: 240px minmax(0,1fr);
  background: var(--ui-bg);
  color: var(--ui-text);
  z-index: 50;
}
body.edit-mode #editor-view { display: grid; }
body.edit-mode #presentation-view { visibility: hidden; pointer-events: none; }

#thumb-rail {
  min-width: 0;
  overflow: auto;
  padding: 1rem 1rem 2rem;
  border-right: 1px solid var(--ui-line);
  background: #ebe8e0;
  scrollbar-gutter: stable;
}
#thumb-list {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: .9rem;
}
.thumb {
  position: relative;
  width: 192px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  user-select: none;
  outline: 0;
}
.thumb.hidden-slide { opacity: .56; }
.thumb.dragging { opacity: .25; }
.thumb.drop-before::before {
  content: "";
  position: absolute;
  z-index: 30;
  left: 0;
  right: 0;
  top: -.48rem;
  height: 3px;
  background: #2368d8;
}
.thumb-canvas {
  position: relative;
  width: 192px;
  height: 108px;
  overflow: hidden;
  border: 1px solid #c9c4ba;
  border-radius: 0;
  background: #000;
  box-shadow: none;
}
.thumb.selected .thumb-canvas {
  outline: 3px solid var(--ui-accent);
  outline-offset: 2px;
}
.thumb-canvas .slide-frame { transform: scale(.12); }
.thumb-number {
  position: absolute;
  z-index: 20;
  top: 4px;
  left: 4px;
  min-width: 1.35rem;
  padding: 2px 5px;
  background: rgba(255,255,255,.92);
  color: #222;
  border: 1px solid rgba(0,0,0,.22);
  font: 700 10px/1.2 var(--ui-mono);
  text-align: center;
  pointer-events: none;
}
.thumb-controls {
  position: absolute;
  z-index: 21;
  top: 4px;
  right: 4px;
  display: flex;
  gap: 3px;
  opacity: 0;
  pointer-events: none;
}
.thumb:hover .thumb-controls,
.thumb.selected .thumb-controls {
  opacity: 1;
  pointer-events: auto;
}
.thumb-controls button {
  width: 25px;
  height: 25px;
  padding: 0;
  border: 1px solid rgba(0,0,0,.28);
  border-radius: 0;
  background: rgba(255,255,255,.94);
  color: #222;
  display: inline-grid;
  place-items: center;
  font-size: 11px;
}
.thumb-controls button:hover:not(:disabled) { background: #fff; border-color: #111; }
.thumb-hidden-label {
  position: absolute;
  z-index: 20;
  right: 4px;
  bottom: 4px;
  padding: 2px 5px;
  border-radius: 0;
  background: rgba(0,0,0,.78);
  color: #fff;
  font: 700 9px/1 var(--ui-font);
}

#editor-main {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: minmax(0,1fr) auto auto;
  overflow: hidden;
}
#workspace {
  min-width: 0;
  min-height: 0;
  display: block;
  padding: 0;
  overflow: hidden;
  background: #fff;
}
#author-pane {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0,1fr) auto minmax(7rem,.27fr);
  border: 0;
  border-radius: 0;
  background: #fff;
  overflow: hidden;
}
#editor-internal-fields {
  display: flex !important;
  align-items: center;
  gap: .65rem;
  min-height: 2.55rem;
  padding: .42rem .8rem;
  border-bottom: 1px solid var(--ui-line);
  background: #f4f1ea;
  color: var(--ui-muted);
  font: 700 .76rem/1 var(--ui-mono);
}
#editor-internal-fields::before { content: "Slide ID"; text-transform: uppercase; letter-spacing: .05em; }
#slide-id { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; color: #202020; font: 600 .84rem/1.3 var(--ui-mono); outline: 0; }
#body-editor {
  width: 100%;
  height: 100%;
  min-height: 0;
  resize: none;
  border: 0;
  border-radius: 0;
  outline: 0;
  padding: 1rem 1.1rem;
  background: #fff;
  color: #202020;
  font: 18px/1.62 var(--ui-mono);
  tab-size: 2;
  white-space: pre-wrap;
}
#format-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .28rem;
  padding: .42rem .65rem;
  border-top: 1px solid var(--ui-line);
  border-bottom: 1px solid var(--ui-line);
  background: #faf9f5;
}
#format-bar button {
  min-width: 2rem;
  min-height: 1.9rem;
  padding: .25rem .45rem;
  border: 1px solid var(--ui-line);
  border-radius: 0;
  background: #fff;
  color: #222;
}
#format-bar .layout-control {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: .42rem;
  color: var(--ui-muted);
  font-size: .8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
}
#format-bar select {
  min-width: 8.25rem;
  min-height: 1.9rem;
  padding: .25rem .45rem;
  border: 1px solid var(--ui-line);
  border-radius: 0;
  background: #fff;
  color: #222;
  text-transform: none;
  letter-spacing: normal;
  font-weight: 500;
}
#notes-pane { min-height: 0; display: grid; grid-template-rows: auto minmax(0,1fr); }
#notes-tabs { display: flex; gap: 0; padding: 0; border-bottom: 1px solid var(--ui-line); }
#notes-tabs button {
  padding: .4rem .75rem;
  border: 0;
  border-right: 1px solid var(--ui-line);
  border-radius: 0;
  background: #e9e6df;
  color: #444;
}
#notes-tabs button.active { background: #fff; font-weight: 700; }
.notes-editor {
  width: 100%;
  height: 100%;
  min-height: 0;
  resize: none;
  border: 0;
  border-radius: 0;
  outline: 0;
  padding: .7rem .9rem;
  background: #fff;
  color: #222;
  font: 15px/1.5 var(--ui-font);
}

#toolbar {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: .34rem;
  min-width: 0;
  padding: .55rem .65rem;
  overflow-x: auto;
  overflow-y: hidden;
  border-top: 1px solid var(--ui-line);
  border-bottom: 1px solid var(--ui-line);
  background: var(--ui-panel);
  scrollbar-width: thin;
}
#toolbar button {
  flex: 0 0 auto;
  width: 2.35rem;
  height: 2.25rem;
  padding: 0;
  border: 1px solid var(--ui-line);
  border-radius: 0;
  background: #fff;
  color: #222;
  display: inline-grid;
  place-items: center;
  font-size: .98rem;
}
#toolbar select {
  flex: 0 0 auto;
  min-height: 2.25rem;
  padding: .3rem .55rem;
  border: 1px solid var(--ui-line);
  border-radius: 0;
  background: #fff;
  color: #222;
}
#toolbar button:hover:not(:disabled), #toolbar select:hover { border-color: #555; }
#toolbar button.primary { background: #1f6f3e; border-color: #1f6f3e; color: #fff; }
#toolbar button.danger { color: var(--ui-danger); }
.toolbar-spacer { flex: 1 0 1.5rem; }
.toolbar-group { display: inline-flex; flex: 0 0 auto; gap: .25rem; padding-right: .35rem; margin-right: .05rem; border-right: 1px solid var(--ui-line); }
#theme-select { min-width: 10rem; }

#statusbar {
  display: flex;
  align-items: center;
  gap: .8rem;
  min-height: 2.35rem;
  padding: .4rem .75rem;
  border-top: 0;
  background: var(--ui-panel);
  font-size: .77rem;

function galleryFitSlot(slot) {
  const frame=slot.querySelector('.slide-frame');
  if(!frame)return;
  const width=slot.clientWidth, height=slot.clientHeight;
  if(!width||!height)return;
  const scale=Math.max(.01,Math.min(width/STAGE_W,height/STAGE_H));
  frame.style.transform=`scale(${scale})`;
  frame.style.left=`${(width-STAGE_W*scale)/2}px`;
  frame.style.top=`${(height-STAGE_H*scale)/2}px`;
}
function galleryBuild() {
  state.deck=normalizeDeck(deepClone(GALLERY_DECK));
  state.currentSlideId=state.deck.slides[0].id;
  const root=document.getElementById('theme-gallery');
  root.replaceChildren();
  THEME_IDS.forEach(([id,label])=>{
    state.deck.meta.theme=id;
    const section=document.createElement('section');
    section.className='theme-set';
    const heading=document.createElement('div'); heading.className='theme-heading';
    const h2=document.createElement('h2'); h2.textContent=label;
    const badge=document.createElement('span'); badge.className='theme-id'; badge.textContent=id;
    heading.append(h2,badge); section.appendChild(heading);
    const row=document.createElement('div'); row.className='triptych';
    state.deck.slides.forEach(slide=>{
      const slot=document.createElement('div'); slot.className='slide-slot';
      const frame=buildCanonicalFrame(slide); applyReveal(frame,slide.steps||0); slot.appendChild(frame); row.appendChild(slot);
    });
    section.appendChild(row);
    const details=document.createElement('details'); details.className='theme-css';
    const summary=document.createElement('summary'); summary.textContent='Complete theme CSS';
    const pre=document.createElement('pre'); pre.textContent=GALLERY_THEME_SOURCES[id]||'';
    details.append(summary,pre); section.appendChild(details); root.appendChild(section);
  });
}
async function galleryFinalize() {
  galleryBuild();
  const root=document.getElementById('theme-gallery');
  await typeset(root);
  await waitForAssets(root);
  root.querySelectorAll('.slide-frame').forEach(fitCanonicalFrame);
  root.querySelectorAll('.slide-slot').forEach(galleryFitSlot);
  const observer=new ResizeObserver(entries=>entries.forEach(entry=>galleryFitSlot(entry.target)));
  root.querySelectorAll('.slide-slot').forEach(slot=>observer.observe(slot));
}
requestAnimationFrame(()=>requestAnimationFrame(galleryFinalize));
